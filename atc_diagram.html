<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#0A0F1E; width:1400px; height:787px; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c" width="1400" height="787"></canvas>
<script>
const cv = document.getElementById('c');
const g = cv.getContext('2d');

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    const R = Array.isArray(r) ? r : [r,r,r,r];
    this.moveTo(x+R[0],y);
    this.lineTo(x+w-R[1],y); this.arcTo(x+w,y,x+w,y+R[1],R[1]);
    this.lineTo(x+w,y+h-R[2]); this.arcTo(x+w,y+h,x+w-R[2],y+h,R[2]);
    this.lineTo(x+R[3],y+h); this.arcTo(x,y+h,x,y+h-R[3],R[3]);
    this.lineTo(x,y+R[0]); this.arcTo(x,y,x+R[0],y,R[0]);
    return this;
  };
}

function lerp(a,b,t){ return a+(b-a)*t; }

const HUB = {x:700, y:408};
const AIRPORTS = [
  {id:'MD',role:'MD / DO',sub:'Physician Queue',x:162,y:265,color:'#8B5CF6',dark:'#2D1254',roof:'#5B21B6',side:'#1A0A3E',items:['Async Rx Consults','Video Consultations','Lab Authorization','Chart Closure'],pos:'above'},
  {id:'RN',role:'RN',sub:'Nursing Queue',x:1238,y:265,color:'#0891B2',dark:'#0B3042',roof:'#0E7490',side:'#061C2A',items:['Critical Lab Triage','Titer Calls','SLA Escalations','On-Call Coverage'],pos:'above'},
  {id:'MA',role:'MA',sub:'Medical Asst Queue',x:162,y:568,color:'#D97706',dark:'#3D1F00',roof:'#92400E',side:'#1F0E00',items:['Intake Processing','Prior Authorizations','Patient Reminders','Lab Scheduling'],pos:'below'},
  {id:'CT',role:'CT',sub:'Care Team Queue',x:1238,y:568,color:'#059669',dark:'#012A1A',roof:'#065F46',side:'#011710',items:['Abnormal Outreach','Reassignment Tasks','Complex Cases','PSR Call Queue'],pos:'below'},
];

const bg = g.createLinearGradient(0,0,0,787);
bg.addColorStop(0,'#1A4825'); bg.addColorStop(0.45,'#2A6633'); bg.addColorStop(0.75,'#367842'); bg.addColorStop(1,'#1E4228');
g.fillStyle=bg; g.fillRect(0,0,1400,787);
g.strokeStyle='rgba(255,255,255,0.035)'; g.lineWidth=1;
for(let x=0;x<1400;x+=65){g.beginPath();g.moveTo(x,52);g.lineTo(x,755);g.stroke();}
for(let y=52;y<755;y+=65){g.beginPath();g.moveTo(0,y);g.lineTo(1400,y);g.stroke();}
g.strokeStyle='rgba(255,255,255,0.02)'; g.lineWidth=1;
for(let i=-800;i<1400;i+=100){g.beginPath();g.moveTo(i,52);g.lineTo(i+800,787);g.stroke();}
const vig=g.createRadialGradient(700,410,280,700,410,820);
vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,8,22,0.6)');
g.fillStyle=vig; g.fillRect(0,52,1400,703);

AIRPORTS.forEach(a=>{
  g.beginPath(); g.moveTo(HUB.x,HUB.y); g.lineTo(a.x,a.y);
  g.strokeStyle=a.color+'30'; g.lineWidth=10; g.stroke();
  g.save(); g.setLineDash([18,11]); g.strokeStyle='#FFD700'; g.lineWidth=2.8;
  g.globalAlpha=0.62; g.shadowColor='#FFD700'; g.shadowBlur=8;
  g.beginPath(); g.moveTo(HUB.x,HUB.y); g.lineTo(a.x,a.y); g.stroke(); g.restore();
  const ang=Math.atan2(a.y-HUB.y,a.x-HUB.x);
  const dist=Math.hypot(a.x-HUB.x,a.y-HUB.y);
  const nx=(a.x-HUB.x)/dist,ny=(a.y-HUB.y)/dist;
  g.save(); g.translate(a.x-nx*22,a.y-ny*22); g.rotate(ang);
  g.fillStyle='#FFD700'; g.globalAlpha=0.82;
  g.beginPath(); g.moveTo(0,0); g.lineTo(-18,-7); g.lineTo(-13,0); g.lineTo(-18,7); g.closePath(); g.fill();
  g.restore();
});

function plane(x,y,ang,sc,col){
  g.save(); g.translate(x,y); g.rotate(ang); g.scale(sc,sc);
  g.shadowColor='rgba(0,0,0,0.55)'; g.shadowBlur=10; g.shadowOffsetX=3; g.shadowOffsetY=3;
  g.beginPath(); g.ellipse(0,0,32,7.5,0,0,Math.PI*2);
  g.fillStyle='#F0F4FF'; g.fill(); g.strokeStyle=col; g.lineWidth=1.8; g.stroke();
  g.beginPath(); g.moveTo(5,-2); g.lineTo(-7,-28); g.lineTo(-15,-27); g.lineTo(-18,-4); g.closePath();
  g.fillStyle='#E2E8F0'; g.fill(); g.strokeStyle=col+'BB'; g.lineWidth=1.2; g.stroke();
  g.beginPath(); g.moveTo(5,2); g.lineTo(-7,28); g.lineTo(-15,27); g.lineTo(-18,4); g.closePath();
  g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-24,-2); g.lineTo(-31,-13); g.lineTo(-28,-2); g.closePath();
  g.fillStyle='#E2E8F0'; g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-24,2); g.lineTo(-31,13); g.lineTo(-28,2); g.closePath();
  g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-22,0); g.lineTo(-32,-10); g.lineTo(-27,0); g.closePath();
  g.fillStyle='rgba(0,0,0,0.15)'; g.fill();
  g.beginPath(); g.ellipse(-4,-2,15,4,0,0,Math.PI*2);
  g.fillStyle='rgba(255,255,255,0.28)'; g.fill();
  g.restore();
}

AIRPORTS.forEach(a=>{
  const ang=Math.atan2(a.y-HUB.y,a.x-HUB.x);
  plane(lerp(HUB.x,a.x,0.27),lerp(HUB.y,a.y,0.27),ang,0.85,a.color);
  plane(lerp(HUB.x,a.x,0.61),lerp(HUB.y,a.y,0.61),ang,0.70,a.color);
});

function panel(a){
  const pw=210,ph=114,bh=56,d=18;
  const px=a.x-pw/2;
  const py=a.pos==='above' ? a.y-bh/2-d-ph-16 : a.y+bh/2+16;
  g.shadowColor='rgba(0,0,0,0.5)'; g.shadowBlur=18; g.shadowOffsetX=0; g.shadowOffsetY=5;
  g.fillStyle='rgba(5,10,26,0.95)';
  g.beginPath(); g.roundRect(px,py,pw,ph,9); g.fill();
  g.shadowColor='transparent';
  g.strokeStyle=a.color; g.lineWidth=2.2;
  g.beginPath(); g.roundRect(px,py,pw,ph,9); g.stroke();
  g.fillStyle=a.color;
  g.beginPath(); g.roundRect(px,py,pw,26,[9,9,0,0]); g.fill();
  g.fillStyle='#FFF'; g.font='bold 12.5px Arial,sans-serif'; g.textAlign='center';
  g.fillText(a.role+' · '+a.sub, a.x, py+17);
  g.textAlign='left'; g.fillStyle='#CBD5E1'; g.font='11px Arial,sans-serif';
  a.items.forEach((item,i)=>{
    g.fillStyle=a.color; g.font='bold 10px sans-serif';
    g.fillText('▸', px+10, py+36+i*20);
    g.fillStyle='#CBD5E1'; g.font='11px Arial,sans-serif';
    g.fillText(item, px+23, py+36+i*20);
  });
  const cy1=a.pos==='above'?py+ph:py;
  const cy2=a.pos==='above'?a.y-bh/2-d+4:a.y+bh/2+2;
  g.beginPath(); g.moveTo(a.x,cy1); g.lineTo(a.x,cy2);
  g.strokeStyle=a.color+'50'; g.lineWidth=1.5; g.setLineDash([5,5]); g.stroke(); g.setLineDash([]);
}
AIRPORTS.forEach(panel);

function building(a){
  const bw=158,bh=56,d=18,x=a.x-bw/2,y=a.y-bh/2;
  g.shadowColor='rgba(0,0,0,0.55)'; g.shadowBlur=18; g.shadowOffsetX=6; g.shadowOffsetY=6;
  g.beginPath(); g.moveTo(x+bw,y); g.lineTo(x+bw+d,y-d); g.lineTo(x+bw+d,y+bh-d); g.lineTo(x+bw,y+bh); g.closePath();
  g.fillStyle=a.side; g.fill();
  g.beginPath(); g.moveTo(x,y); g.lineTo(x+bw,y); g.lineTo(x+bw+d,y-d); g.lineTo(x+d,y-d); g.closePath();
  g.fillStyle=a.roof; g.fill();
  g.fillStyle=a.dark; g.fillRect(x,y,bw,bh);
  g.shadowColor='transparent';
  for(let r=0;r<3;r++) for(let c=0;c<4;c++){
    const wx=x+13+c*35,wy=y+8+r*14;
    g.fillStyle='rgba(100,190,255,0.5)'; g.fillRect(wx,wy,24,10);
    g.strokeStyle='rgba(255,255,255,0.2)'; g.lineWidth=0.5; g.strokeRect(wx,wy,24,10);
  }
  g.fillStyle=a.color; g.fillRect(x,y,bw,12);
  g.fillStyle='#FFF'; g.font='bold 9.5px Arial,sans-serif'; g.textAlign='center';
  g.fillText(a.id, a.x, y+9);
  g.strokeStyle=a.color+'AA'; g.lineWidth=1.8; g.strokeRect(x,y,bw,bh);
  g.fillStyle='rgba(0,0,0,0.4)'; g.fillRect(a.x-10,y+bh-22,20,22);
  g.fillStyle='rgba(0,0,0,0.2)';
  g.beginPath(); g.ellipse(a.x+d/2, y+bh+6, bw/2+10, 8, 0, 0, Math.PI*2); g.fill();
  g.strokeStyle='rgba(255,255,255,0.12)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(a.x+d/2-20,y+bh+6); g.lineTo(a.x+d/2+20,y+bh+6); g.stroke();
  g.beginPath(); g.moveTo(a.x+d/2,y+bh-4); g.lineTo(a.x+d/2,y+bh+16); g.stroke();
}
AIRPORTS.forEach(building);

(function(){
  const cx=HUB.x,cy=HUB.y;
  [42,74,112,155].forEach((r,i)=>{
    g.beginPath(); g.arc(cx,cy+32,r,0,Math.PI*2);
    g.strokeStyle=`rgba(124,58,237,${0.28-i*0.055})`; g.lineWidth=1.5;
    g.setLineDash([9,8]); g.stroke(); g.setLineDash([]);
  });
  const bw=78,bh=48,bd=17,bx=cx-bw/2,by=cy+28;
  g.shadowColor='rgba(0,0,0,0.55)'; g.shadowBlur=22; g.shadowOffsetX=6; g.shadowOffsetY=6;
  g.beginPath(); g.moveTo(bx+bw,by); g.lineTo(bx+bw+bd,by-bd); g.lineTo(bx+bw+bd,by+bh-bd); g.lineTo(bx+bw,by+bh); g.closePath(); g.fillStyle='#130622'; g.fill();
  g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+bw,by); g.lineTo(bx+bw+bd,by-bd); g.lineTo(bx+bd,by-bd); g.closePath(); g.fillStyle='#4C1D95'; g.fill();
  g.fillStyle='#1E0B3A'; g.fillRect(bx,by,bw,bh);
  for(let i=0;i<4;i++){g.fillStyle='rgba(100,160,255,0.35)'; g.fillRect(bx+8+i*17,by+12,12,8);}
  g.shadowColor='transparent';
  const sw=24,sh=92,sx=cx-sw/2,sy=by-sh;
  g.shadowColor='rgba(0,0,0,0.5)'; g.shadowBlur=14; g.shadowOffsetX=4; g.shadowOffsetY=4;
  g.beginPath(); g.moveTo(sx+sw,sy); g.lineTo(sx+sw+9,sy-9); g.lineTo(sx+sw+9,sy+sh-9); g.lineTo(sx+sw,sy+sh); g.closePath(); g.fillStyle='#0D0417'; g.fill();
  g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+sw,sy); g.lineTo(sx+sw+9,sy-9); g.lineTo(sx+9,sy-9); g.closePath(); g.fillStyle='#3B0764'; g.fill();
  g.fillStyle='#180630'; g.fillRect(sx,sy,sw,sh);
  [0.28,0.52,0.76].forEach(f=>{g.fillStyle='rgba(100,190,255,0.4)'; g.fillRect(sx+3,sy+sh*f,sw-6,9);});
  g.shadowColor='transparent';
  const caby=sy-20;
  g.shadowColor='rgba(139,92,246,0.5)'; g.shadowBlur=22;
  g.beginPath(); g.ellipse(cx,caby,38,16,0,0,Math.PI*2); g.fillStyle='#120528'; g.fill();
  g.strokeStyle='#9F67FF'; g.lineWidth=2.8; g.stroke();
  g.beginPath(); g.ellipse(cx-9,caby-5,14,5.5,0,0,Math.PI*2); g.fillStyle='rgba(147,210,255,0.18)'; g.fill();
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2, gx=cx+Math.cos(a)*24, gy=caby+Math.sin(a)*10;
    g.beginPath(); g.arc(gx,gy,3,0,Math.PI*2);
    g.fillStyle=`rgba(167,139,250,${0.5+Math.cos(a)*0.3})`; g.fill();
  }
  g.shadowColor='transparent';
  g.strokeStyle='#C4B5FD'; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(cx,caby-14); g.lineTo(cx,caby-42); g.stroke();
  g.beginPath(); g.arc(cx,caby-42,18,0.15,Math.PI-0.15);
  g.strokeStyle='#A78BFA'; g.lineWidth=2.2; g.stroke();
  g.beginPath(); g.moveTo(cx,caby-42); g.lineTo(cx,caby-34);
  g.strokeStyle='#C4B5FD'; g.lineWidth=1.5; g.stroke();
  g.beginPath(); g.moveTo(cx,caby-42); g.lineTo(cx+26,caby-62);
  g.strokeStyle='rgba(167,139,250,0.65)'; g.lineWidth=2; g.stroke();
  g.beginPath(); g.arc(cx+26,caby-62,4,0,Math.PI*2);
  g.fillStyle='rgba(196,181,253,0.7)'; g.fill();
  const lw=228,lh=62,lx=cx,ly=by+bh+8;
  g.shadowColor='rgba(0,0,0,0.4)'; g.shadowBlur=14;
  g.fillStyle='rgba(5,10,26,0.94)';
  g.beginPath(); g.roundRect(lx-lw/2,ly,lw,lh,9); g.fill();
  g.shadowColor='transparent';
  g.strokeStyle='#7C3AED'; g.lineWidth=2.2;
  g.beginPath(); g.roundRect(lx-lw/2,ly,lw,lh,9); g.stroke();
  g.fillStyle='#7C3AED';
  g.beginPath(); g.roundRect(lx-lw/2,ly,lw,24,[9,9,0,0]); g.fill();
  g.fillStyle='#FFF'; g.font='bold 12px Arial,sans-serif'; g.textAlign='center';
  g.fillText('PLATFORM INTELLIGENCE HUB', lx, ly+16);
  g.fillStyle='#C4B5FD'; g.font='11px Arial,sans-serif';
  g.fillText('Air Traffic Controller — routes all patient consults', lx, ly+38);
  g.fillStyle='#8B5CF6'; g.font='10px Arial,sans-serif';
  g.fillText('Automatic · SLA-Tracked · Real-Time · Zero Manual Triage', lx, ly+54);
})();

function pill(x,y,txt,col){
  g.font='11px Arial,sans-serif';
  const tw=g.measureText(txt).width, pw=tw+22,ph=22;
  g.fillStyle='rgba(5,10,26,0.9)';
  g.beginPath(); g.roundRect(x-pw/2,y-ph/2,pw,ph,11); g.fill();
  g.strokeStyle=col; g.lineWidth=1.5;
  g.beginPath(); g.roundRect(x-pw/2,y-ph/2,pw,ph,11); g.stroke();
  g.fillStyle=col; g.textAlign='center'; g.fillText(txt,x,y+4);
}
const [md,rn,ma,ct]=AIRPORTS;
pill(lerp(HUB.x,md.x,0.5)-10,lerp(HUB.y,md.y,0.5)-24,'Rx · Async · Video','#A78BFA');
pill(lerp(HUB.x,rn.x,0.5)+10,lerp(HUB.y,rn.y,0.5)-24,'Labs · Titers · SLA','#22D3EE');
pill(lerp(HUB.x,ma.x,0.5)-10,lerp(HUB.y,ma.y,0.5)+24,'Intake · PA · Reminders','#FCD34D');
pill(lerp(HUB.x,ct.x,0.5)+10,lerp(HUB.y,ct.y,0.5)+24,'Outreach · Cases · PSR','#34D399');

g.fillStyle='rgba(6,12,30,0.96)'; g.fillRect(0,0,1400,52);
g.fillStyle='#7C3AED'; g.fillRect(0,50,1400,2);
g.fillStyle='#FFF'; g.font='bold 21px Arial,sans-serif'; g.textAlign='left';
g.fillText('Everlywell Telehealth Platform  —  Air Traffic Control', 28,34);
g.fillStyle='#94A3B8'; g.font='12px Arial,sans-serif';
g.fillText('The platform intelligently routes every patient consult to the right provider queue — automatically, in real time', 28,50);

g.fillStyle='rgba(6,12,30,0.96)'; g.fillRect(0,753,1400,34);
g.fillStyle='#7C3AED'; g.fillRect(0,753,1400,2);
g.fillStyle='#818CF8'; g.font='bold 11.5px Arial,sans-serif'; g.textAlign='center';
g.fillText('4 Role Queues  ·  Automatic Routing by Consult Type  ·  SLA-Tracked  ·  Zero Manual Triage  ·  Full Audit Trail  ·  Real-Time', 700,773);
</script>
</body>
