<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWN Health — Sign In</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0A2F5C;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    max-width: 420px;
    width: 100%;
    padding: 40px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .logo-icon {
    font-size: 26px;
    color: #00BFB3;
    line-height: 1;
  }
  .logo-text {
    font-size: 28px;
    font-weight: 700;
    color: #0A2F5C;
    letter-spacing: -0.5px;
  }
  .tagline {
    font-size: 14px;
    color: #6B7280;
    font-style: italic;
    margin-bottom: 32px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 5px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    border: 1.5px solid #E5E7EB;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: #111827;
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #0A2F5C; }
  #loginBtn {
    width: 100%;
    background: #0A2F5C;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  #loginBtn:hover { background: #0c3a70; }
  .help-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: #6B7280;
    text-decoration: none;
  }
  .help-link:hover { color: #0A2F5C; }
  .demo-box {
    margin-top: 20px;
    background: #F9FAFB;
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12px;
    color: #6B7280;
    line-height: 1.7;
  }
  .demo-box strong { color: #374151; }
  .footer-text {
    margin-top: 28px;
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <span class="logo-icon">&#9672;</span>
      <span class="logo-text">PWN Health</span>
    </div>
    <div class="tagline">Your Health. Your Results.</div>

    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="jennifer.adams@email.com" value="jennifer.adams@email.com">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" value="demo1234">

      <button id="loginBtn">Sign In</button>
    </div>

    <a href="#" class="help-link">Need help? Contact PWN Support</a>

    <div class="demo-box">
      <strong>Demo Access</strong><br>
      Email: jennifer.adams@email.com<br>
      Password: demo1234
    </div>
  </div>

  <div class="footer-text">Powered by a HIPAA-compliant telehealth platform</div>

  <script>
    document.getElementById('loginBtn').addEventListener('click', function() {
      window.location.href = '/pwn/portal';
    });
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') window.location.href = '/pwn/portal';
    });
  </script>
</body>
</html>
