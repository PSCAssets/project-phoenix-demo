<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Portal — Sign In</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F9FAFB;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    max-width: 420px;
    width: 100%;
    padding: 40px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    border: 1px solid #E5E7EB;
  }
  .logo {
    font-size: 26px;
    font-weight: 700;
    color: #6B21A8;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .tagline {
    font-size: 14px;
    color: #6B7280;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 5px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    border: 1.5px solid #E5E7EB;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: #111827;
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #6B21A8; }
  #loginBtn {
    width: 100%;
    background: #6B21A8;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  #loginBtn:hover { background: #5B1898; }
  .demo-box {
    margin-top: 20px;
    background: #F5F3FF;
    border: 1px solid #DDD6FE;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12px;
    color: #6B7280;
    line-height: 1.7;
  }
  .demo-box strong { color: #374151; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo" style="display:flex;align-items:center;gap:8px;"><span style="color:#6B21A8;">&#9672;</span> Patient Portal</div>
    <div class="tagline">Access your health consultations</div>

    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="marcus.johnson@email.com" value="marcus.johnson@email.com">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" value="demo1234">

      <button id="loginBtn">Sign In</button>
    </div>

    <div class="demo-box">
      <strong>Demo Access</strong><br>
      Email: marcus.johnson@email.com<br>
      Password: demo1234
    </div>
  </div>

  <script>
    document.getElementById('loginBtn').addEventListener('click', function() {
      window.location.href = '/patient/portal';
    });
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') window.location.href = '/patient/portal';
    });
  </script>
</body>
</html>
