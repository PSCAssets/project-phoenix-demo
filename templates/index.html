{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block head %}
<style>
  /* Hide global nav and sidebar on login screen */
  .nav { display: none !important; }
  .g-sidebar { display: none !important; }
  body { padding-top: 0 !important; }
  .g-shell { display: block !important; }

  .nav-badge { background: #dc2626 !important; }

  .login-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 48px;
    min-height: calc(100vh - 60px - 64px);
  }

  .login-heading {
    text-align: center;
    margin-bottom: 28px;
  }
  .login-heading h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #1D4ED8;
    letter-spacing: -.3px;
    margin-bottom: 6px;
  }
  .login-heading p {
    font-size: .875rem;
    color: #6b7280;
  }

  /* ── Layout ── */
  .switcher-layout {
    display: flex;
    width: 100%;
    max-width: 820px;
    border: 1.5px solid #E5E0D8;
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 16px rgba(0,0,0,.07);
    margin-bottom: 20px;
  }

  /* ── Sidebar ── */
  .sw-sidebar {
    width: 200px;
    flex-shrink: 0;
    border-right: 1px solid #E5E0D8;
    background: #F9F8F6;
  }
  .sw-sidebar-header {
    padding: 12px 16px 8px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #9CA3AF;
    border-bottom: 1px solid #E5E0D8;
  }
  .sw-dept-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 14px;
    font-size: 12.5px;
    color: #4B5563;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    border-left: 3px solid transparent;
    transition: background .12s;
  }
  .sw-dept-btn:hover { background: #F0EEE9; }
  .sw-dept-btn.active {
    background: #EDE9FE;
    color: #5B21B6;
    font-weight: 600;
    border-left-color: #6B21A8;
  }
  .sw-dept-btn .sw-count {
    margin-left: auto;
    font-size: 10.5px;
    background: #E5E7EB;
    color: #6B7280;
    border-radius: 10px;
    padding: 1px 7px;
    min-width: 20px;
    text-align: center;
    font-weight: 500;
  }
  .sw-dept-btn.active .sw-count {
    background: #DDD6FE;
    color: #5B21B6;
  }
  .sw-dept-icon {
    font-size: 14px;
    width: 15px;
    text-align: center;
    flex-shrink: 0;
  }

  /* ── Main panel ── */
  .sw-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .sw-main-header {
    padding: 12px 18px;
    border-bottom: 1px solid #E5E0D8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
  }
  .sw-main-label {
    font-size: 13px;
    font-weight: 700;
    color: #111827;
  }
  .sw-main-sub {
    font-size: 12px;
    color: #9CA3AF;
  }

  /* ── Section dividers (in All view) ── */
  .sw-section-div {
    padding: 7px 18px 5px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #9CA3AF;
    background: #F9F8F6;
    border-bottom: 1px solid #E5E0D8;
  }

  /* ── User rows ── */
  .sw-user-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid #F3F4F6;
    transition: background .1s;
  }
  .sw-user-row:last-child { border-bottom: none; }
  .sw-user-row:hover { background: #F9F8F6; }

  .sw-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .sw-user-info { flex: 1; min-width: 0; }
  .sw-user-name {
    font-size: 13px;
    font-weight: 600;
    color: #111827;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sw-user-meta {
    font-size: 11.5px;
    color: #6B7280;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .sw-portal-badge {
    display: inline-block;
    font-size: 10.5px;
    padding: 1px 7px;
    border-radius: 4px;
    background: #F3F4F6;
    border: 1px solid #E5E7EB;
    color: #9CA3AF;
    margin-left: 6px;
    font-weight: 500;
  }

  .sw-login-btn {
    flex-shrink: 0;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    background: #6B21A8;
    color: #fff;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    transition: background .12s;
  }
  .sw-login-btn:hover { background: #5B1898; color: #fff; text-decoration: none; }

  /* ── Patient portal section ── */
  .patient-section {
    max-width: 820px;
    width: 100%;
    background: #fff;
    border-radius: 14px;
    padding: 16px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.07);
    border: 1.5px solid #E5E0D8;
    margin-bottom: 16px;
  }
  .patient-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #9CA3AF;
    margin-bottom: 12px;
  }

  .login-footer {
    font-size: .75rem;
    color: #9ca3af;
    text-align: center;
    letter-spacing: .2px;
  }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">

  <div class="login-heading">
    <h1>Select your account to continue</h1>
    <p>Telehealth &mdash; Demo Environment</p>
  </div>

  <div class="switcher-layout">

    <!-- Sidebar -->
    <div class="sw-sidebar">
      <div class="sw-sidebar-header">Department</div>

      <button class="sw-dept-btn active" onclick="swFilter('all')" id="swbtn-all">
        <span class="sw-dept-icon">&#9783;</span>
        All users
        <span class="sw-count" id="swc-all">16</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('physician')" id="swbtn-physician">
        <span class="sw-dept-icon">&#9877;</span>
        Physicians
        <span class="sw-count" id="swc-physician">2</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('nursing')" id="swbtn-nursing">
        <span class="sw-dept-icon">&#10010;</span>
        Nursing
        <span class="sw-count" id="swc-nursing">1</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('ma')" id="swbtn-ma">
        <span class="sw-dept-icon">&#128203;</span>
        Medical Assistants
        <span class="sw-count" id="swc-ma">1</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('genetics')" id="swbtn-genetics">
        <span class="sw-dept-icon">&#128300;</span>
        Genetics
        <span class="sw-count" id="swc-genetics">3</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('clinical-ops')" id="swbtn-clinical-ops">
        <span class="sw-dept-icon">&#128202;</span>
        Clinical Ops
        <span class="sw-count" id="swc-clinical-ops">2</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('management')" id="swbtn-management">
        <span class="sw-dept-icon">&#128101;</span>
        Management
        <span class="sw-count" id="swc-management">2</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('scheduling')" id="swbtn-scheduling">
        <span class="sw-dept-icon">&#128197;</span>
        Scheduling
        <span class="sw-count" id="swc-scheduling">1</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('care-team')" id="swbtn-care-team">
        <span class="sw-dept-icon">&#128222;</span>
        Care Team
        <span class="sw-count" id="swc-care-team">1</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('admin')" id="swbtn-admin">
        <span class="sw-dept-icon">&#9881;</span>
        Admin
        <span class="sw-count" id="swc-admin">1</span>
      </button>
      <button class="sw-dept-btn" onclick="swFilter('patient')" id="swbtn-patient">
        <span class="sw-dept-icon">&#128100;</span>
        Patient
        <span class="sw-count" id="swc-patient">2</span>
      </button>
    </div>

    <!-- Main panel -->
    <div class="sw-main">
      <div class="sw-main-header">
        <span class="sw-main-label" id="sw-main-label">All users</span>
        <span class="sw-main-sub" id="sw-main-sub">15 accounts</span>
      </div>
      <div id="sw-user-list"></div>
    </div>

  </div>

  <div class="login-footer">Demo environment &mdash; not for clinical use</div>

</div>

<script>
const SW_USERS = [
  {initials:'SL', color:'#1B4F8A', name:'Dr. Sarah Lee, MD',     role:'Physician (Internal Medicine)',      dept:'physician',    portal:'Provider Portal — MD',   loginRole:'provider_md',  btnLabel:'Log in as Sarah — Physician (MD)'},
  {initials:'MR', color:'#0D9488', name:'Maria Rodriguez, NP',   role:'Nurse Practitioner',                 dept:'physician',    portal:'Provider Portal — NP',   loginRole:'provider_np',  btnLabel:'Log in as Maria — Nurse Practitioner'},
  {initials:'JM', color:'#00A99D', name:'Jennifer Martinez, Lead RN', role:'Lead RN',                   dept:'nursing',      portal:'Provider Portal — RN',   loginRole:'provider_rn',  btnLabel:'Log in as Jennifer — RN'},
  {initials:'MT', color:'#445D7A', name:'Michael Torres, MA',    role:'Medical Assistant',                  dept:'ma',           portal:'Provider Portal — MA',   loginRole:'provider_ma',  btnLabel:'Log in as Michael — Medical Assistant'},
  {initials:'LP', color:'#6B5EA8', name:'Lisa Park, MS CGC',     role:'Genetic Counselor',                  dept:'genetics',     portal:'Provider Portal — GC',   loginRole:'provider_gc',  btnLabel:'Log in as Lisa — Genetic Counselor'},
  {initials:'PS', color:'#BE185D', name:'Priya Sharma',          role:'GC Assistant',                       dept:'genetics',     portal:'GCA Portal',             loginRole:'provider_gca', btnLabel:'Log in as Priya — GC Assistant'},
  {initials:'DC', color:'#0E7490', name:'Dana Cooper',           role:'GC Administrator',                   dept:'genetics',     portal:'Provider Portal',        loginRole:'gc_admin',     btnLabel:'Log in as Dana — GC Administrator'},
  {initials:'RC', color:'#B45309', name:'Rachel Chen',           role:'QA Reviewer',                        dept:'clinical-ops', portal:'Provider Portal',        loginRole:'qa_reviewer',  btnLabel:'Log in as Rachel — QA Reviewer'},
  {initials:'CV', color:'#0F766E', name:'Crystal Veliz',         role:'DOH Coordinator',                    dept:'clinical-ops', portal:'DOH Reporting Portal',   loginRole:'provider_doh', btnLabel:'Log in as Crystal — DOH Coordinator'},
  {initials:'RP', color:'#7C3AED', name:'Riley Perrone',         role:'MA / RN Team Manager',               dept:'management',   portal:'Manager Portal',         loginRole:'provider_manager', btnLabel:'Log in as Riley — Team Manager'},
  {initials:'MM', color:'#059669', name:'Melanie Marmo',         role:'PSS Team Manager',                   dept:'management',   portal:'Care Team Portal — PSS', loginRole:'provider_psr', btnLabel:'Log in as Melanie — PSS Manager'},
  {initials:'DN', color:'#D97706', name:'David Nguyen',          role:'Scheduling Coordinator',             dept:'scheduling',   portal:'Scheduling',             loginRole:'scheduler',    btnLabel:'Log in as David — Scheduling Coordinator'},
  {initials:'AK', color:'#059669', name:'Alex Kim',              role:'Care Team',                          dept:'care-team',    portal:'Care Team Portal',       loginRole:'care_team',    btnLabel:'Log in as Alex — Care Team'},
  {initials:'ML', color:'#D97706', name:'Missy Lemieux',         role:'Gaps in Care Specialist',            dept:'management',   portal:'Gaps in Care — 🚧 Under Construction', loginRole:'care_team_gaps', btnLabel:'Log in as Missy — Gaps in Care'},
  {initials:'CN', color:'#1D4ED8', name:'Chris Navarro',         role:'Platform Admin',                     dept:'admin',        portal:'Admin Portal',           loginRole:'admin',        btnLabel:'Log in as Chris — Platform Admin'},
  {initials:'JR', color:'#0EA5E9', name:'Jamie Rivera',          role:'Patient',                            dept:'patient',      portal:'Everlywell Patient Portal', loginUrl:'/patient/login', btnLabel:'Log in as Jamie — Everlywell Patient'},
  {initials:'WP', color:'#0A2F5C', name:'PWN Demo Patient',      role:'Patient',                            dept:'patient',      portal:'PWN Health Portal',      loginUrl:'/pwn/login',    btnLabel:'Log in as PWN Demo Patient'},
];

const SW_DEPT_NAMES = {
  'all':         'All users',
  'physician':   'Physicians & Advanced Practice',
  'nursing':     'Nursing',
  'ma':          'Medical Assistants',
  'genetics':    'Genetics',
  'clinical-ops':'Clinical Operations',
  'management':  'Management',
  'scheduling':  'Scheduling',
  'care-team':   'Care Team',
  'admin':       'Admin',
  'patient':     'Patient',
};

const SW_DEPT_ORDER = ['physician','nursing','ma','genetics','clinical-ops','management','scheduling','care-team','admin','patient'];

let swCurrent = 'all';

function swFilter(dept) {
  swCurrent = dept;
  document.querySelectorAll('.sw-dept-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('swbtn-' + dept);
  if (btn) btn.classList.add('active');
  swRender();
}

function swRow(u) {
  const href = u.loginUrl || ('/login/' + u.loginRole);
  return `<div class="sw-user-row">
    <div class="sw-avatar" style="background:${u.color}">${u.initials}</div>
    <div class="sw-user-info">
      <div class="sw-user-name">${u.name}</div>
      <div class="sw-user-meta">${u.role}<span class="sw-portal-badge">${u.portal}</span></div>
    </div>
    <a href="${href}" class="sw-login-btn">Log in →</a>
  </div>`;
}

function swRender() {
  const list = document.getElementById('sw-user-list');
  const label = document.getElementById('sw-main-label');
  const sub = document.getElementById('sw-main-sub');

  const filtered = swCurrent === 'all' ? SW_USERS : SW_USERS.filter(u => u.dept === swCurrent);
  label.textContent = SW_DEPT_NAMES[swCurrent] || swCurrent;
  sub.textContent = filtered.length + (filtered.length === 1 ? ' account' : ' accounts');

  let html = '';
  if (swCurrent === 'all') {
    SW_DEPT_ORDER.forEach(d => {
      const group = SW_USERS.filter(u => u.dept === d);
      if (!group.length) return;
      html += `<div class="sw-section-div">${SW_DEPT_NAMES[d]}</div>`;
      group.forEach(u => { html += swRow(u); });
    });
  } else {
    filtered.forEach(u => { html += swRow(u); });
  }
  list.innerHTML = html;
}

swRender();
</script>
{% endblock %}
