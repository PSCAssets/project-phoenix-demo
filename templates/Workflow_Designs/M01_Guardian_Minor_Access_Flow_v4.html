<!-- KEY RULES -->
<rect x="20" y="1210" width="1220" height="100" rx="6" fill="#F5F6FA" stroke="#1F3864" stroke-width="1.5"/>
<text x="630" y="1232" fill="#1F3864" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">KEY RULES</text>
<text x="630" y="1251" fill="#333" font-size="10" text-anchor="middle" font-family="Arial">• Guardian link is self-service — no System Admin approval required for standard setup. Guardian must attest they are legal parent or guardian (out-of-platform verification).</text>
<text x="630" y="1269" fill="#333" font-size="10" text-anchor="middle" font-family="Arial">• System Admin involved only for exceptions: disputes, forced removal, or access conflicts.</text>
<text x="630" y="1287" fill="#333" font-size="10" text-anchor="middle" font-family="Arial">• Age of majority transition is fully automated — no manual step required. Both accounts remain active and independent after transition.</text>
<text x="630" y="1305" fill="#333" font-size="10" text-anchor="middle" font-family="Arial">• Guardian actions always carry guardian's user ID in audit logs. Minor's records are never co-mingled with guardian account data.</text>
