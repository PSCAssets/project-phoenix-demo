  <text x="40" y="1312" font-family="Arial" font-size="11" font-weight="bold" fill="#1F3864">KEY RULES — Intake Snapshot vs. Health Profile</text>
  <text x="40" y="1330" font-family="Arial" font-size="10" fill="#333">▸  Intake snapshot is immutable: once submitted, it is permanently linked to that consult visit ID and never overwritten by future health profile changes.</text>

  <text x="40" y="1364" font-family="Arial" font-size="10" fill="#333">▸  Pre-population is read-only at load time: the form pulls from health profile at open; edits flow back only on successful submission.</text>
