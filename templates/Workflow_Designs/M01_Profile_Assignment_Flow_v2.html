<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Account Creation and Profile Assignment Flow v2</title>
<style>
body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; }
h1 { color: #1F3864; text-align: center; font-size: 16px; margin-bottom: 4px; letter-spacing: 1px; }
.subtitle { text-align: center; color: #666; font-size: 12px; margin-bottom: 14px; }
.legend { display: flex; gap: 20px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.dot { width: 13px; height: 13px; border-radius: 2px; }
</style>
</head>
<body>
<h1>USER ACCOUNT CREATION AND PROFILE ASSIGNMENT FLOW</h1>
<div class="subtitle">Project Phoenix · M01 Roles & Responsibilities · v2</div>
<div class="legend">
  <div class="legend-item"><div class="dot" style="background:#1F3864"></div>Manager / User Action</div>
  <div class="legend-item"><div class="dot" style="background:#2E86AB"></div>System Admin Action</div>
  <div class="legend-item"><div class="dot" style="background:#27AE60"></div>Platform System</div>
  <div class="legend-item"><div class="dot" style="background:#F39C12"></div>New User / Decision</div>
  <div class="legend-item"><div class="dot" style="background:#E74C3C"></div>Blocked / Error</div>
</div>

<svg width="1260" height="1060" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr"   markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#444"/></marker>
  <marker id="arr-g" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#27AE60"/></marker>
  <marker id="arr-o" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#F39C12"/></marker>
  <marker id="arr-b" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#2E86AB"/></marker>
  <marker id="arr-r" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#E74C3C"/></marker>
</defs>

<!-- LANE BACKGROUNDS -->
<rect x="0"   y="0" width="315" height="1060" fill="#EEF2FA"/>
<rect x="315" y="0" width="315" height="1060" fill="#F0F5FA"/>
<rect x="630" y="0" width="315" height="1060" fill="#F0F8F0"/>
<rect x="945" y="0" width="315" height="1060" fill="#FFFAF0"/>

<!-- LANE DIVIDERS -->
<line x1="315"  y1="0" x2="315"  y2="1060" stroke="#DDD" stroke-width="1"/>
<line x1="630"  y1="0" x2="630"  y2="1060" stroke="#DDD" stroke-width="1"/>
<line x1="945"  y1="0" x2="945"  y2="1060" stroke="#DDD" stroke-width="1"/>

<!-- LANE HEADERS -->
<rect x="0" y="0" width="1260" height="42" fill="#1F3864"/>
<text x="157"  y="26" fill="white" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">REQUESTING MANAGER</text>
<text x="472"  y="26" fill="white" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">SYSTEM ADMIN</text>
<text x="787"  y="26" fill="white" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">PLATFORM SYSTEM</text>
<text x="1102" y="26" fill="white" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">NEW USER</text>

<!-- ============================================================ -->
<!-- ROW 1: Start + Manager submits request -->
<!-- ============================================================ -->
<!-- Start oval -->
<ellipse cx="157" cy="76" rx="90" ry="22" fill="#1F3864"/>
<text x="157" y="81" fill="white" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">START: Access Request</text>
<line x1="157" y1="98" x2="157" y2="116" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Manager submits box -->
<rect x="30" y="118" width="254" height="48" rx="5" fill="#1F3864"/>
<text x="157" y="138" fill="white" font-size="10" text-anchor="middle" font-family="Arial">Manager submits access request</text>
<text x="157" y="153" fill="white" font-size="10" text-anchor="middle" font-family="Arial">via email / ticketing system</text>
<line x1="157" y1="166" x2="157" y2="184" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Includes box -->
<rect x="30" y="186" width="254" height="48" rx="5" fill="#1F3864" stroke="#2E86AB" stroke-width="1" stroke-dasharray="4,2"/>
<text x="157" y="206" fill="white" font-size="10" text-anchor="middle" font-family="Arial">Includes: name, email, role,</text>
<text x="157" y="221" fill="white" font-size="10" text-anchor="middle" font-family="Arial">programs, start date</text>

<!-- Off-platform label -->
<text x="310" y="218" fill="#888" font-size="9" text-anchor="end" font-family="Arial" font-style="italic">off-platform</text>

<!-- Arrow: Manager → System Admin (horizontal, clean) -->
<line x1="284" y1="210" x2="330" y2="210" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

<!-- ============================================================ -->
<!-- ROW 2: System Admin logs in and creates account -->
<!-- ============================================================ -->
<!-- Sys Admin logs in -->
<rect x="330" y="186" width="254" height="48" rx="5" fill="#2E86AB"/>
<text x="457" y="206" fill="white" font-size="10" text-anchor="middle" font-family="Arial">System Admin logs into</text>
<text x="457" y="221" fill="white" font-size="10" text-anchor="middle" font-family="Arial">Admin Portal</text>
<line x1="457" y1="234" x2="457" y2="254" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Creates account -->
<rect x="330" y="256" width="254" height="58" rx="5" fill="#2E86AB"/>
<text x="457" y="276" fill="white" font-size="10" text-anchor="middle" font-family="Arial">Creates new user account:</text>
<text x="457" y="291" fill="white" font-size="10" text-anchor="middle" font-family="Arial">· Name, email</text>
<text x="457" y="306" fill="white" font-size="10" text-anchor="middle" font-family="Arial">· Selects one Profile from library</text>
<line x1="457" y1="314" x2="457" y2="334" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ============================================================ -->
<!-- ROW 3: Decision — Profile = System Admin? -->
<!-- ============================================================ -->
<polygon points="457,336 527,360 457,384 387,360" fill="#F39C12"/>
<text x="457" y="356" fill="white" font-size="10" font-weight="bold" text-anchor="middle" font-family="Arial">Profile =</text>
<text x="457" y="370" fill="white" font-size="10" text-anchor="middle" font-family="Arial">System Admin?</text>

<!-- Yes — right to Platform lane warning -->
<line x1="527" y1="360" x2="644" y2="360" stroke="#F39C12" stroke-width="1.5" marker-end="url(#arr-o)"/>
<text x="580" y="352" fill="#F39C12" font-size="10" font-weight="bold" font-family="Arial">Yes</text>

<!-- Warning box in Platform lane -->
<rect x="646" y="336" width="265" height="48" rx="5" fill="#FFF2CC" stroke="#F39C12" stroke-width="2"/>
<text x="778" y="356" fill="#1F3864" font-size="10" font-weight="bold" text-anchor="middle" font-family="Arial">⚠ Only System Admin can assign</text>
<text x="778" y="371" fill="#1F3864" font-size="10" text-anchor="middle" font-family="Arial">Sys Admin profile — confirm</text>

<!-- Arrow back from warning → System Admin (continue after confirmation) -->
<line x1="646" y1="360" x2="528" y2="360" stroke="#F39C12" stroke-width="1" stroke-dasharray="3,3"/>

<!-- No — straight down -->
<line x1="457" y1="384" x2="457" y2="404" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="467" y="398" fill="#444" font-size="10" font-family="Arial">No</text>

<!-- ============================================================ -->
<!-- ROW 4: Set scope -->
<!-- ============================================================ -->
<rect x="330" y="406" width="254" height="48" rx="5" fill="#2E86AB"/>
<text x="457" y="426" fill="white" font-size="10" text-anchor="middle" font-family="Arial">Admin sets program / care</text>
<text x="457" y="441" fill="white" font-size="10" text-anchor="middle" font-family="Arial">product scope for user</text>
<line x1="457" y1="454" x2="457" y2="474" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ============================================================ -->
<!-- ROW 5: Save account — triggers platform email -->
<!-- ============================================================ -->
<rect x="330" y="476" width="254" height="48" rx="5" fill="#2E86AB"/>
<text x="457" y="496" fill="white" font-size="10" text-anchor="middle" font-family="Arial">System Admin saves</text>
<text x="457" y="511" fill="white" font-size="10" text-anchor="middle" font-family="Arial">account record</text>

<!-- Arrow right: System Admin saves → Platform sends email -->
<line x1="584" y1="500" x2="644" y2="500" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Platform sends email box -->
<rect x="646" y="476" width="265" height="48" rx="5" fill="#27AE60"/>
<text x="778" y="496" fill="white" font-size="10" text-anchor="middle" font-family="Arial">Platform sends welcome /</text>
<text x="778" y="511" fill="white" font-size="10" text-anchor="middle" font-family="Arial">setup email to user</text>

<!-- Arrow right: Platform → New User receives email -->
<line x1="911" y1="500" x2="958" y2="500" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- New User receives email -->
<rect x="960" y="476" width="272" height="48" rx="5" fill="#F39C12"/>
<text x="1096" y="496" fill="white" font-size="10" text-anchor="middle" font-family="Arial">New User receives welcome</text>
<text x="1096" y="511" fill="white" font-size="10" text-anchor="middle" font-family="Arial">email with setup link</text>
<line x1="1096" y1="524" x2="1096" y2="544" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ============================================================ -->
<!-- ROW 6: User clicks link + decision Internal Staff? -->
<!-- ============================================================ -->
<rect x="960" y="546" width="272" height="42" rx="5" fill="#1F3864"/>
<text x="1096" y="562" fill="white" font-size="10" text-anchor="middle" font-family="Arial">User clicks setup link</text>
<text x="1096" y="577" fill="white" font-size="10" text-anchor="middle" font-family="Arial">in email</text>
<line x1="1096" y1="588" x2="1096" y2="608" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Decision diamond -->
<polygon points="1096,610 1156,634 1096,658 1036,634" fill="#F39C12"/>
<text x="1096" y="630" fill="white" font-size="10" font-weight="bold" text-anchor="middle" font-family="Arial">Internal</text>
<text x="1096" y="644" fill="white" font-size="10" text-anchor="middle" font-family="Arial">Staff?</text>

<!-- Yes — left to SSO path -->
<line x1="1036" y1="634" x2="960" y2="634" stroke="#2E86AB" stroke-width="1.5"/>
<line x1="960"  y1="634" x2="960" y2="680" stroke="#2E86AB" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="992" y="626" fill="#2E86AB" font-size="10" font-family="Arial" font-weight="bold">Yes</text>

<!-- No — right (stays in same column, goes down) -->
<line x1="1156" y1="634" x2="1210" y2="634" stroke="#27AE60" stroke-width="1.5"/>
<line x1="1210" y1="634" x2="1210" y2="680" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="1162" y="626" fill="#27AE60" font-size="10" font-family="Arial" font-weight="bold">No</text>

<!-- ============================================================ -->
<!-- ROW 7: Two parallel paths -->
<!-- ============================================================ -->
<!-- Internal Staff: SSO setup -->
<rect x="960" y="682" width="120" height="68" rx="5" fill="#2E86AB"/>
<text x="1020" y="700" fill="white" font-size="9" font-weight="bold" text-anchor="middle" font-family="Arial">INTERNAL STAFF:</text>
<text x="1020" y="714" fill="white" font-size="9" text-anchor="middle" font-family="Arial">Redirected to SSO</text>
<text x="1020" y="728" fill="white" font-size="9" text-anchor="middle" font-family="Arial">login setup</text>
<text x="1020" y="742" fill="white" font-size="9" text-anchor="middle" font-family="Arial">Links corporate account</text>
<line x1="1020" y1="750" x2="1020" y2="770" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Partner / Patient: platform password -->
<rect x="1148" y="682" width="92" height="68" rx="5" fill="#27AE60"/>
<text x="1194" y="700" fill="white" font-size="9" font-weight="bold" text-anchor="middle" font-family="Arial">PARTNER /</text>
<text x="1194" y="714" fill="white" font-size="9" font-weight="bold" text-anchor="middle" font-family="Arial">PATIENT:</text>
<text x="1194" y="728" fill="white" font-size="9" text-anchor="middle" font-family="Arial">Creates password</text>
<text x="1194" y="742" fill="white" font-size="9" text-anchor="middle" font-family="Arial">Configures 2FA</text>
<line x1="1194" y1="750" x2="1194" y2="770" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ============================================================ -->
<!-- ROW 8: Configure 2FA (staff) -->
<!-- ============================================================ -->
<rect x="960" y="772" width="120" height="48" rx="5" fill="#2E86AB"/>
<text x="1020" y="792" fill="white" font-size="9" text-anchor="middle" font-family="Arial">Configures 2FA</text>
<text x="1020" y="806" fill="white" font-size="9" text-anchor="middle" font-family="Arial">via Corporate IdP</text>
<line x1="1020" y1="820" x2="1020" y2="840" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Partner/Patient already done at row 7 — route down -->
<line x1="1194" y1="820" x2="1194" y2="840" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ============================================================ -->
<!-- ROW 9: Merge to Account Active -->
<!-- ============================================================ -->
<!-- Horizontal merge line -->
<line x1="1020" y1="842" x2="1194" y2="842" stroke="#444" stroke-width="1.5"/>
<line x1="1107" y1="842" x2="1107" y2="862" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Account Active box -->
<rect x="960" y="864" width="272" height="54" rx="5" fill="#27AE60"/>
<text x="1096" y="884" fill="white" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">Account Active — Setup Complete</text>
<text x="1096" y="901" fill="white" font-size="10" text-anchor="middle" font-family="Arial">User logs in per appropriate path</text>

<!-- ============================================================ -->
<!-- AUDIT LOG — Platform System lane bottom -->
<!-- ============================================================ -->
<!-- Dashed line from Account Active back to Platform System for logging -->
<line x1="960" y1="891" x2="928" y2="891" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="928" y1="891" x2="928" y2="930" stroke="#888" stroke-width="1.5"/>
<line x1="928" y1="930" x2="912" y2="930" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="646" y="906" width="265" height="58" rx="5" fill="#27AE60"/>
<text x="778" y="926" fill="white" font-size="10" text-anchor="middle" font-family="Arial">System logs account creation:</text>
<text x="778" y="941" fill="white" font-size="10" text-anchor="middle" font-family="Arial">· System Admin ID</text>
<text x="778" y="956" fill="white" font-size="10" text-anchor="middle" font-family="Arial">· Profile assigned · Timestamp</text>

<!-- ============================================================ -->
<!-- SELF-ESCALATION BLOCKED note -->
<!-- ============================================================ -->
<rect x="20" y="950" width="590" height="60" rx="6" fill="#FCE4D6" stroke="#E74C3C" stroke-width="1.5"/>
<text x="315" y="972" fill="#C0392B" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">⛔ Self-Escalation Explicitly Prohibited</text>
<text x="315" y="989" fill="#333" font-size="10" text-anchor="middle" font-family="Arial">No user can modify their own profile, grant themselves additional rights,</text>
<text x="315" y="1003" fill="#333" font-size="10" text-anchor="middle" font-family="Arial">or request elevated access through the platform. System Admin action required.</text>

<!-- KEY RULES -->
<rect x="20" y="1022" width="1220" height="28" rx="6" fill="#F5F6FA" stroke="#1F3864" stroke-width="1.5"/>
<text x="630" y="1041" fill="#1F3864" font-size="10" text-anchor="middle" font-family="Arial">All profile assignments and account creations are logged with System Admin ID · Profile assigned · Timestamp · Programs scoped. Logs are permanent.</text>

</svg>
</body>
</html>
